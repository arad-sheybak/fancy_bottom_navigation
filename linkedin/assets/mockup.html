<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FancyBottomSheet mockup</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; }
  #screen {
    position: relative;
    width: 380px;
    height: 820px;
    overflow: hidden;
    background: linear-gradient(180deg, #0E0E11 0%, #1B1B22 100%);
    color: #fff;
    font-family: "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
    --accent: #E53946;
  }
  .statusbar {
    height: 40px;
    padding: 0 20px 0 26px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    opacity: 0.95;
  }
  .statusbar .right { display: flex; align-items: center; gap: 6px; }
  .content { padding: 22px 24px 0 24px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 2px;
    font-weight: 500;
    color: rgba(255,255,255,0.45);
  }
  .title { margin-top: 10px; font-size: 34px; font-weight: 700; letter-spacing: -0.3px; }
  .desc { margin-top: 8px; font-size: 15px; color: rgba(255,255,255,0.6); }
  .card {
    margin-top: 28px;
    width: 100%;
    height: 190px;
    border-radius: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
    transition: background 0.25s ease, border-color 0.25s ease;
  }
  .card span {
    font-size: 22px;
    letter-spacing: 4px;
    font-weight: 600;
    color: var(--accent);
    transition: color 0.25s ease;
  }
  .navbar-wrap {
    position: absolute;
    left: 0; right: 0;
    bottom: 40px;
    padding: 0 2px;
    display: flex;
    justify-content: center;
  }
  .bar {
    position: relative;
    width: 100%;
    height: 74px;
    border-radius: 999px;
    background: #1A1A1E;
    border: 1px solid #2E2E36;
    box-shadow: 0 18px 42px rgba(229,57,70,0.30), 0 8px 20px rgba(0,0,0,0.55);
  }
  .indicator {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    overflow: visible;
    pointer-events: none;
  }
  .row {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    padding: 0 23px;
    border-radius: 999px;
  }
  .nav-item {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }
  .icon-wrap { position: relative; display: flex; }
  .icon-wrap svg { width: 22px; height: 22px; display: block; }
  .icon-wrap path { transition: fill 0.2s ease; }
  .nav-label {
    margin-top: 3px;
    font-size: 10px;
    line-height: 11px;
    font-weight: 500;
    color: #8A8A94;
    transition: color 0.2s ease;
  }
  .nav-item.selected .nav-label { color: #fff; font-weight: 600; }
  .badge {
    position: absolute;
    top: -5px;
    right: -7px;
    min-width: 15px;
    height: 15px;
    padding: 0 3px;
    border-radius: 999px;
    background: #E53946;
    border: 1.5px solid #1A1A1E;
    color: #fff;
    font-size: 8px;
    line-height: 12px;
    font-weight: 700;
    text-align: center;
  }
</style>
</head>
<body>
<div id="screen">
  <div class="statusbar">
    <div>9:41</div>
    <div class="right">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.5" y="6" width="3" height="6" rx="1"/><rect x="9" y="3" width="3" height="9" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"><path d="M1 4.2C3 2.4 5.4 1.5 8 1.5s5 .9 7 2.7"/><path d="M3.4 6.8C4.7 5.6 6.3 5 8 5s3.3.6 4.6 1.8"/><path d="M5.8 9.3C6.5 8.7 7.2 8.4 8 8.4s1.5.3 2.2.9"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="#fff" opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="1.6" fill="#fff"/><path d="M23 4v4c1-.3 1.6-1 1.6-2S24 4.3 23 4z" fill="#fff" opacity="0.5"/></svg>
    </div>
  </div>

  <div class="content">
    <div class="eyebrow" id="eyebrow">FANCY BOTTOM SHEET</div>
    <div class="title" id="title">Home</div>
    <div class="desc" id="desc">Your dashboard and latest activity.</div>
    <div class="card"><span id="card-label">HOME</span></div>
  </div>

  <div class="navbar-wrap">
    <div class="bar" id="bar">
      <svg class="indicator" id="indicator" viewBox="0 0 380 82" preserveAspectRatio="none">
        <path id="measure" d="" fill="none" stroke="none"></path>
        <path id="glow1" d="" fill="none" stroke="#E53946" stroke-width="8.1" stroke-opacity="0.07" stroke-linecap="round" stroke-linejoin="round"></path>
        <path id="glow2" d="" fill="none" stroke="#E53946" stroke-width="3.96" stroke-opacity="0.16" stroke-linecap="round" stroke-linejoin="round"></path>
        <path id="core" d="" fill="none" stroke="#E53946" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div class="row" id="row"></div>
    </div>
  </div>
</div>

<script>
const ICONS = {
  home: "M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z",
  search: "M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z",
  create: "M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z",
  inbox: "M19 3H4.99c-1.11 0-1.98.89-1.98 2L3 19c0 1.1.88 2 1.99 2H19c1.1 0 2-.9 2-2V5c0-1.11-.9-2-2-2zm0 12h-4c0 1.66-1.35 3-3 3s-3-1.34-3-3H4.99V5H19v10z",
  saved: "M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"
};

const NAV_ITEMS = [
  { id: "home",   label: "Home",   navColor: "#E53946", accent: "#E53946", desc: "Your dashboard and latest activity." },
  { id: "search", label: "Search", navColor: "#3D9DF6", accent: "#4FA3FF", desc: "Find people, tracks and messages." },
  { id: "create", label: "Create", navColor: "#8B5CF6", accent: "#9C6BFF", desc: "Start something new." },
  { id: "inbox",  label: "Inbox",  navColor: "#F59E0B", accent: "#FFA726", desc: "You have 3 unread messages.", badge: 3 },
  { id: "saved",  label: "Saved",  navColor: "#10B981", accent: "#41D9A5", desc: "Everything you bookmarked, in one place." },
];

const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const row = document.getElementById("row");
const measure = document.getElementById("measure");
const glow1 = document.getElementById("glow1");
const glow2 = document.getElementById("glow2");
const core = document.getElementById("core");
const titleEl = document.getElementById("title");
const descEl = document.getElementById("desc");
const cardLabel = document.getElementById("card-label");

const itemEls = [];
const iconWrapEls = [];
const iconEls = [];

NAV_ITEMS.forEach((item) => {
  const el = document.createElement("div");
  el.className = "nav-item";
  el.dataset.id = item.id;
  const wrap = document.createElement("div");
  wrap.className = "icon-wrap";
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  svg.setAttribute("viewBox", "0 0 24 24");
  const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
  path.setAttribute("d", ICONS[item.id]);
  path.setAttribute("fill", "#9A9AA5");
  svg.appendChild(path);
  wrap.appendChild(svg);
  if (item.badge) {
    const b = document.createElement("div");
    b.className = "badge";
    b.textContent = item.badge > 9 ? "9+" : String(item.badge);
    wrap.appendChild(b);
  }
  const label = document.createElement("div");
  label.className = "nav-label";
  label.textContent = item.label;
  el.appendChild(wrap);
  el.appendChild(label);
  row.appendChild(el);
  itemEls.push(el);
  iconWrapEls.push(wrap);
  iconEls.push(svg);
});

function buildGeometry(sel) {
  const barRect = bar.getBoundingClientRect();
  const cell = itemEls[sel].getBoundingClientRect();
  const contentRect = iconWrapEls[sel].getBoundingClientRect();
  const iconRect = iconEls[sel].getBoundingClientRect();

  const inset = 4;
  const targetLeft = cell.left + inset - barRect.left;
  const targetRight = cell.right - inset - barRect.left;
  const centerX = iconRect.left + iconRect.width / 2 - barRect.left;
  const contentTop = contentRect.top - barRect.top;
  const contentBottom = contentRect.bottom - barRect.top;

  const bodyWidth = Math.max(1, targetRight - targetLeft);
  const halfWidth = bodyWidth * 0.62;
  const contentHeight = Math.max(1, contentBottom - contentTop);
  const verticalPadding = contentHeight * 0.22;
  const topY = contentTop - verticalPadding;
  const baseY = contentBottom + verticalPadding;
  const fillet = Math.min(contentHeight * 0.18, halfWidth * 0.24);
  const ellipseBaseY = baseY - fillet;
  const verticalRadius = Math.max(1, ellipseBaseY - topY);
  const leftFilletX = centerX - halfWidth - fillet;
  const rightFilletX = centerX + halfWidth + fillet;
  const indicatorWidth = rightFilletX - leftFilletX;
  const maxTailEndX = barRect.width - 12;

  const progress = sel / (NAV_ITEMS.length - 1);
  const cellWidth = cell.width;
  const firstRightFilletX = rightFilletX - sel * cellWidth;
  const maxLineLength = Math.max(0, maxTailEndX - firstRightFilletX) * 0.8;
  const leftLineLength = maxLineLength * progress;
  const rightLineLength = maxLineLength * (1 - progress);
  const leftTailStart = leftFilletX - leftLineLength;
  const rightTailEnd = Math.min(rightFilletX + rightLineLength, maxTailEndX);

  const K = 0.5523;
  const d = [
    "M " + leftTailStart + " " + baseY,
    "L " + leftFilletX + " " + baseY,
    "Q " + (centerX - halfWidth) + " " + baseY + " " + (centerX - halfWidth) + " " + ellipseBaseY,
    "C " + (centerX - halfWidth) + " " + (ellipseBaseY - verticalRadius * K) + " " + (centerX - halfWidth * K) + " " + topY + " " + centerX + " " + topY,
    "C " + (centerX + halfWidth * K) + " " + topY + " " + (centerX + halfWidth) + " " + (ellipseBaseY - verticalRadius * K) + " " + (centerX + halfWidth) + " " + ellipseBaseY,
    "Q " + (centerX + halfWidth) + " " + baseY + " " + rightFilletX + " " + baseY,
    "L " + rightTailEnd + " " + baseY,
  ].join(" ");

  return { d, indicatorWidth, isLast: sel === NAV_ITEMS.length - 1 };
}

function sample(trimStart, trimEnd, fraction) {
  measure.setAttribute("d", geometry.d);
  const total = measure.getTotalLength();
  const start = Math.max(0, Math.min(trimStart, total));
  const end = Math.max(start, Math.min(trimEnd, total));
  const revealEnd = start + (end - start) * fraction;
  if (revealEnd - start < 0.01) return "";
  const target = revealEnd;
  const steps = Math.max(24, Math.ceil((target - start) / 1.4));
  let out = "";
  for (let i = 0; i <= steps; i++) {
    const t = start + (target - start) * (i / steps);
    const pt = measure.getPointAtLength(t);
    out += (i === 0 ? "M " : "L ") + pt.x.toFixed(2) + " " + pt.y.toFixed(2) + " ";
  }
  return out.trim();
}

let geometry = null;

function render(sel, fraction) {
  const item = NAV_ITEMS[sel];
  screen.style.setProperty("--accent", item.accent);
  titleEl.textContent = item.label;
  descEl.textContent = item.desc;
  cardLabel.textContent = item.label.toUpperCase();

  itemEls.forEach((el, i) => {
    const selected = i === sel;
    el.classList.toggle("selected", selected);
    const path = el.querySelector("path");
    path.setAttribute("fill", selected ? NAV_ITEMS[i].navColor : "#9A9AA5");
  });

  geometry = buildGeometry(sel);
  const trimStart = geometry.indicatorWidth * 0.08;
  measure.setAttribute("d", geometry.d);
  const total = measure.getTotalLength();
  const end = geometry.isLast ? total - geometry.indicatorWidth * 0.08 : total;
  const d = sample(trimStart, end, fraction);

  const color = item.navColor;
  [glow1, glow2, core].forEach((el) => el.setAttribute("stroke", color));
  glow1.setAttribute("d", d);
  glow2.setAttribute("d", d);
  core.setAttribute("d", d);
}

function boot() {
  const params = new URLSearchParams(location.search);
  const sel = Math.max(0, Math.min(NAV_ITEMS.length - 1, parseInt(params.get("sel") || "0", 10)));
  const p = Math.max(0, Math.min(1, parseFloat(params.get("p") || "1")));
  render(sel, p);
  window.__rendered = true;
  document.title = "ready";
}

if (document.readyState === "complete") boot();
else window.addEventListener("load", boot);
</script>
</body>
</html>
